[project]
name = "contract-generator"
version = "0.1.0"
description = "Renders Jinja2 HTML contracts into PDFs with fillable AcroForm fields, sends them to DocuSign, and reads filled values back."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.13"
dependencies = [
    "weasyprint>=66",
    "jinja2>=3.1",
    "pypdf>=5",
    "docusign-esign>=5",
    "temporalio>=1.9",
]

[project.scripts]
contract-generator-worker = "contract_generator.temporal.worker:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/contract_generator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "src"
packages = ["contract_generator"]

[[tool.mypy.overrides]]
module = ["weasyprint.*", "docusign_esign.*"]
ignore_missing_imports = true
