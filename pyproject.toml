[project]
name = "esign-forms"
version = "0.2.0"
description = "Render Jinja2 HTML templates into PDFs with fillable AcroForm fields, send them to DocuSign for signature, and read the filled values back."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [{ name = "Emre Aydin" }]
keywords = ["pdf", "acroform", "docusign", "e-signature", "weasyprint", "forms"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business",
    "Typing :: Typed",
]
dependencies = [
    "weasyprint>=66",
    "jinja2>=3.1",
    "pypdf>=5",
    "docusign-esign>=5",
]

[project.optional-dependencies]
worker = ["temporalio>=1.9"]

[project.urls]
Homepage = "https://github.com/emre-aydin/esign-forms"
Repository = "https://github.com/emre-aydin/esign-forms"
Issues = "https://github.com/emre-aydin/esign-forms/issues"

[project.scripts]
esign-forms = "esign_forms.cli:main"
esign-forms-worker = "esign_forms._worker_entry:main"

[dependency-groups]
dev = [
    "esign-forms[worker]",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/esign_forms"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["esign_forms"]

[[tool.mypy.overrides]]
module = ["weasyprint.*", "docusign_esign.*"]
ignore_missing_imports = true

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "examples", "README.md", "LICENSE"]
