name: contract-generator-worker
title: Contract Generator Temporal Worker
summary: Temporal worker that generates fillable contract PDFs and sends them to DocuSign
description: |
  An OCI rock packaging the contract-generator library as a Python Temporal worker, intended to be
  used as the workload (oci-image) resource of the temporal-worker-k8s charm (2.0/stable).

  The worker registers the ContractSigningWorkflow on the configured task queue. The workflow
  takes a template name and parameters, renders a DocuSign-ready AcroForm PDF, and sends it to
  DocuSign for signature, returning the envelope id.

  Connection settings are read from the TEMPORAL_* environment variables the charm injects
  (TEMPORAL_HOST, TEMPORAL_NAMESPACE, TEMPORAL_QUEUE, TEMPORAL_TLS_ROOT_CAS,
  TEMPORAL_PROMETHEUS_PORT). DocuSign credentials are supplied via DOCUSIGN_* environment
  variables (set through the charm's `environment` config).
version: "0.1.0"
license: Apache-2.0

base: ubuntu@26.04
build-base: ubuntu@26.04
platforms:
  amd64:

# The charm manages (enables/replaces) this service; it ships disabled so the image can be
# introspected without immediately trying to connect to a Temporal server.
services:
  temporal-worker:
    override: replace
    summary: Contract generator Temporal worker
    command: /app/scripts/start-worker.sh
    startup: disabled
    environment:
      TEMPORAL_HOST: "localhost:7233"
      TEMPORAL_NAMESPACE: "default"
      TEMPORAL_QUEUE: "contracts"

parts:
  worker:
    plugin: nil
    source: .
    build-snaps:
      - astral-uv
    build-packages:
      - python3
      - python3-venv
      - ca-certificates
    # Build the venv at its final path (/app/venv) so the interpreter symlink and console-script
    # shebangs stay valid in the image, then copy it into the part's install dir.
    override-build: |
      craftctl default
      export UV_PROJECT_ENVIRONMENT=/app/venv UV_PYTHON=/usr/bin/python3 \
        UV_PYTHON_DOWNLOADS=never UV_LINK_MODE=copy UV_COMPILE_BYTECODE=1
      rm -rf /app/venv
      uv sync --locked --no-dev --no-editable
      mkdir -p ${CRAFT_PART_INSTALL}/app
      cp -a /app/venv ${CRAFT_PART_INSTALL}/app/venv

  runtime:
    plugin: nil
    stage-packages:
      - python3
      # WeasyPrint's system libraries (Pango + HarfBuzz subsetting).
      - libpango-1.0-0
      - libpangoft2-1.0-0
      - libharfbuzz-subset0
      - bash
      - coreutils
      - ca-certificates

  start-script:
    plugin: dump
    source: rock/
    organize:
      start-worker.sh: app/scripts/start-worker.sh
